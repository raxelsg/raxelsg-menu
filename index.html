<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaxelSG - Santa Cruz</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="preload" href="fonts/CormorantGaramond-Regular.woff2" as="font" type="font/woff2">
    <link rel="preload" href="fonts/CormorantGaramond-Light.woff2" as="font" type="font/woff2">
    <link rel="preload" href="fonts/BebasNeue-Regular.woff2" as="font" type="font/woff2">
    <link rel="preload" href="fonts/Monoton-Regular.woff2" as="font" type="font/woff2">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <main class="menu">

        <!-- ================= ZONA IZQUIERDA — STUDIO ================= -->
        <a href="#" class="half half--studio" aria-label="Acceder a RAXEL SG Studio">
            <div class="half__bg studio__bg"></div>
            <div class="half__veil studio__veil"></div>

            <!-- Destellos de flash de cámara en distintas zonas -->
            <span class="flash flash--1"></span>
            <span class="flash flash--2"></span>
            <span class="flash flash--3"></span>
            <span class="flash flash--4"></span>
            <span class="flash flash--5"></span>

            <div class="half__content studio__content">
                <span class="half__eyebrow">Momentos que perduran</span>
                <h2 class="studio__title">Studio</h2>
                <p class="half__desc">Comuniones · Bautizos · Bodas · Retrato</p>
                <span class="half__cta">Entrar al estudio</span>
            </div>
        </a>

        <!-- ================= ZONA DERECHA — NIGHTLIFE ================= -->
        <a href="#" class="half half--night" aria-label="Acceder a RAXEL SG Nightlife">
            <div class="half__bg night__bg"></div>
            <div class="half__veil night__veil"></div>

            <!-- Capa donde se generan las chispas -->
            <div class="sparks" aria-hidden="true"></div>

            <div class="half__content night__content">
                <span class="half__eyebrow">La noche es nuestra</span>
                <h2 class="night__title" data-text="Nightlife">
                    <span class="letter">N</span><span class="letter">i</span><span class="letter">g</span><span class="letter">h</span><span class="letter">t</span><span class="letter">l</span><span class="letter">i</span><span class="letter">f</span><span class="letter">e</span>
                </h2>
                <p class="half__desc">Fiestas · Conciertos · Eventos musicales</p>
                <span class="half__cta">Entrar a la fiesta</span>
            </div>
        </a>

        <!-- Sello central -->
        <div class="brand">
            <span class="brand__name">RAXEL SG</span>
            <span class="brand__slash">/</span>
        </div>

    </main>

    <script src="scripts/menu.js"></script>
</body>
</html>
