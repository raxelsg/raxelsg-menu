<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaxelSG - Santa Cruz</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preload" href="fonts/CormorantGaramond-Regular.woff2" as="font" type="font/woff2">
    <link rel="preload" href="fonts/CormorantGaramond-Light.woff2" as="font" type="font/woff2">
    <link rel="preload" href="fonts/BebasNeue-Regular.woff2" as="font" type="font/woff2">
    <link rel="preload" href="fonts/Righteous-Regular.woff2" as="font" type="font/woff2">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <main class="menu">
        <div class="half half--studio">
            <div class="half__bg studio__bg"></div>
            <div class="half__veil studio__veil"></div>

            <span class="flash flash--1"></span>
            <span class="flash flash--2"></span>
            <span class="flash flash--3"></span>
            <span class="flash flash--4"></span>
            <span class="flash flash--5"></span>

            <div class="half__content studio__content">
                <span class="half__eyebrow">Luz · Emoción · Recuerdos</span>
                <h2 class="studio__title">STUDIO</h2>
                <p class="half__desc">Celebraciones · Retratos · Comercial · <span style="white-space: nowrap;">Contenido RRSS</span></p>
                <a class="half__cta" href="https://studio.raxelsg.es/">Entrar al estudio</a>
            </div>
        </div>

        <div class="half half--night">
            <div class="half__bg night__bg"></div>
            <div class="half__veil night__veil"></div>

            <div class="sparks" aria-hidden="true"></div>

            <div class="half__content night__content">
                <span class="half__eyebrow">Ritmo · Energía · Experiencias</span>
                <h2 class="night__title" data-text="Nightlife">
                    <span class="letter">N</span><span class="letter">I</span><span class="letter">G</span><span
                        class="letter">H</span><span class="letter">T</span><span class="letter">L</span><span
                        class="letter">I</span><span class="letter">F</span><span class="letter">E</span>
                </h2>
                <p class="half__desc">Festivales · Clubs · Conciertos · DJ'S</p>
                <a class="half__cta" href="https://nightlife.raxelsg.es/">Entrar a la fiesta</a>
            </div>
        </div>

        <div class="brand">
            <span class="brand__name">RAXEL SG</span>
            <span class="brand__slash">/</span>
        </div>

    </main>

    <script src="scripts/menu.js"></script>
</body>

</html>
